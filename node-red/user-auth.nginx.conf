# Place these locations INSIDE your existing HTTPS server block.
# API_BASE_URL currently ends in /api; request paths also start /api.
# Keep a single server block per hostname/listen combination.
location = /_ruhanex_auth {
    internal;
    proxy_pass http://127.0.0.1:1880/api/auth/authorize;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Origin $http_origin;
}

location = /api/api/auth/authorize { return 404; }
location = /api/auth/authorize { return 404; }

# Auth endpoints perform their own session and Admin checks.
location ^~ /api/api/auth/ {
    proxy_pass http://127.0.0.1:1880/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Ruhanex-Role "";
    proxy_set_header X-Ruhanex-User "";
}

location = /api/api/ai/chat {
    auth_request /_ruhanex_auth;
    auth_request_set $chat_role $upstream_http_x_ruhanex_role;
    auth_request_set $chat_user $upstream_http_x_ruhanex_user;
    proxy_set_header X-Ruhanex-Role $chat_role;
    proxy_set_header X-Ruhanex-User $chat_user;
    # Replace with the private AI_CHAT_BEARER_TOKEN configured in Node-RED.
    proxy_set_header Authorization "Bearer REPLACE_WITH_PRIVATE_CHAT_KEY";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:1880/api/ai/chat;
    proxy_read_timeout 240s;
}

location /api/api/ {
    auth_request /_ruhanex_auth;
    auth_request_set $api_role $upstream_http_x_ruhanex_role;
    auth_request_set $api_user $upstream_http_x_ruhanex_user;
    proxy_set_header X-Ruhanex-Role $api_role;
    proxy_set_header X-Ruhanex-User $api_user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:1880/api/;
}

# Close the old single-prefix proxy to prevent bypassing the new gateway.
# Other clients using it must migrate to the public /api/api/... paths.
location /api/ { return 404; }
